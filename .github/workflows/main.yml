name: Publish NuGet Package

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Calabonga.PagedListCore.slnx

      - name: Build
        run: dotnet build src/Calabonga.PagedListCore.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/Calabonga.PagedListCore.slnx --configuration Release --no-restore

      - name: Build the NuGet package
        run: dotnet pack src/Calabonga.PagedListCore.slnx --configuration Release --no-restore --output ${{env.DOTNET_ROOT}}\Package

      - name: Publish NuGet Package
        run: dotnet nuget push ${{env.DOTNET_ROOT}}\Package\*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
